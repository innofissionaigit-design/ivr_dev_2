[pytest]
asyncio_mode = auto

# The four CI Sanity Gate markers (Backlog-Sprints-and-Gates.xlsx, sheet
# "CI Sanity Gates"). Registered here so `pytest -m <marker>` never warns
# about an unknown marker even before each suite has real tests under it.
# An unmarked test inside a suite directory is meant to fail the build
# once those directories exist (see that sheet) -- until they do, treat
# "0 collected" for these four as a known, tracked gap (Epic E24), never
# as a pass.
markers =
    degradation: per-bucket golden-set scoring (Epic E24 / E18 -- not yet implemented)
    latency: per-stage timing against the Appendix B budget on stubs (Epic E24 / E16 -- not yet implemented)
    security: secrets/PHI/injection adversarial checks (Epic E24 / E20 -- not yet implemented)
    hallucination: template-substitution + not-found-path regression guards (Epic E24 -- partially covered today by tests/test_smoke.py's Naloxone-class guards; full suite not yet implemented)
